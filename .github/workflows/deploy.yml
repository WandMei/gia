name: Deploy para VPS de Producao

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build e Sync para VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # 1. Prepara o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 2. Instala as dependências e compila o site (Gera a pasta dist)
      - name: Install & Build
        run: |
          npm install
          npm run build

      # 3. Transfere apenas a pasta dist recém-gerada para a VPS
      - name: Copiar arquivos para a VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "dist/"
          target: "/opt/stacks/website-gia"
          strip_components: 0